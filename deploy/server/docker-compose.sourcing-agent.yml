# The Sourcing Agent on the agents host: a runtime in front of a service. Two containers: sourcing-runtime and sourcing-service.
# The runtime serves the advert. It holds the supplier key, claims the escrow of a hirer and calls the service. The service does the work and holds the nine keys of the agent. The runtime calls it.
# The env file sits next to this file (RUNBOOK-sourcing-agent.md, "The env file"). The service and the runtime both read it: .env.sourcing-agent.
# The operator makes it from .env.sourcing-agent.example, with mode 600. It holds keys and a token, and it never enters git.
# A container reads its env file when it is created. After a change, create the container again: restart does not read it. Do it only when the runtime says free on /status (RUNBOOK-sourcing-agent.md, "The restart rule").
# The host builds no image. CI pushes the images. Each image below is named by its digest, not by a tag: a tag moves, and a later pull could change the bytes that run here.
# Replace each placeholder <digest> with the digest of the image of the reviewed commit (RUNBOOK-sourcing-agent.md, "The images"). Compose refuses to start a container while a placeholder is left (invalid reference format).
# The file has no networks key, on purpose. Compose puts the two containers on the default network of this project, sourcing-agent_default. The Caddy container of the host joins that network, and no other container does (Caddyfile.sourcing-agent.snippet).
# The service listens on 0.0.0.0 inside its container. A container on a network that others share could call it, so do not add a networks key here, and do not join another container to that network.
# SERVICE_URL names the container of the service, not the alias "service". The Caddy container joins the networks of several projects, and each project can have a service with that alias.
# The limits keep a fault in one container. A runtime of the other agents of the host uses about 190 MiB. If a container grows past its limit, the kernel stops that container only.
name: sourcing-agent
services:
  runtime:
    image: ghcr.io/apex-fusion/vector-service-agents/agent-runtime@sha256:<digest>
    container_name: sourcing-runtime
    restart: unless-stopped
    env_file: [ { path: ./.env.sourcing-agent, required: true } ]
    # The runtime holds the supplier key, from the env file. The nine keys of the service are in the same file, so they are blanked here: an empty string overrides the value from an env file, and the runtime never holds them.
    # SERVICE_TIMEOUT_MS is 60 s more than the deadline of a job (5,220,000 ms), and 120 s inside the window of the advert (5,400,000 ms). The runtime refuses to boot unless it is at least 60 s inside the window.
    # The escrow and the vault payment of a hirer stay locked up to the window, 90 minutes, when a job runs to its end. So stop or create a container again only when the runtime says free.
    # SERVICE_PRECHECK_URL is the check before the Claim. The service answers it from its job slot, so it refuses a job while it works on another.
    # PUBLIC_ORIGIN is the https origin of the host name of the runtime. The card of the runtime and the record of the agent name it, and it is the host of the block in Caddyfile.sourcing-agent.snippet.
    # RELEASE_WATCHER releases an escrow that the buyer did not accept, after the window of 600 s. It needs LIVE_CHAIN=1, which the env file sets.
    environment:
      CAPABILITY_KIND: custom
      SERVICE_URL: http://sourcing-service:9105/
      SERVICE_PRECHECK_URL: http://sourcing-service:9105/precheck
      SERVICE_CONTENT_TYPE: application/json
      SERVICE_TIMEOUT_MS: "5280000"
      ADVERT_MAX_PROCESSING_MS: "5400000"
      PORT: "8080"
      PUBLIC_ORIGIN: https://mp-suppliers-sourcing.vector.apexfusion.org
      RELEASE_WATCHER: "1"
      SOURCING_SERVICE_PRIV_KEY_HEX: ""
      SOURCING_DELEGATION_1_PRIV_KEY_HEX: ""
      SOURCING_DELEGATION_2_PRIV_KEY_HEX: ""
      SCORER_1_AUTH_PRIV_KEY_HEX: ""
      SCORER_1_DELEGATION_PRIV_KEY_HEX: ""
      SCORER_2_AUTH_PRIV_KEY_HEX: ""
      SCORER_2_DELEGATION_PRIV_KEY_HEX: ""
      SCORER_3_AUTH_PRIV_KEY_HEX: ""
      SCORER_3_DELEGATION_PRIV_KEY_HEX: ""
    ports: ["127.0.0.1:8107:8080"]
    depends_on: [service]
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  service:
    image: ghcr.io/apex-fusion/vector-service-agents/sourcing-agent@sha256:<digest>
    container_name: sourcing-service
    restart: unless-stopped
    # The service reads the same file as the runtime. It never holds the supplier key, which is the key of the runtime. SUPPLIER_PRIV_KEY_HEX is blanked below, so that no supplier key gets in by this file.
    env_file: [ { path: ./.env.sourcing-agent, required: true } ]
    # The service listens on 0.0.0.0:9105 inside its container, and the mapping below publishes it on 127.0.0.1 only. The compose values win over the env file.
    # SOURCING_STATE_DIR is the volume below.
    environment: { PORT: "9105", HOST: "0.0.0.0", SUPPLIER_PRIV_KEY_HEX: "", SOURCING_STATE_DIR: /data }
    ports: ["127.0.0.1:9105:9105"]
    # The records that must outlive the container: the escrows of each of the three paying keys, the journal of the dispute code, the sub-delegations that a job left and the register of the co-signed transactions. docker compose down keeps the volume.
    volumes: ["sourcing-state:/data"]
    mem_limit: 1024m
    # On SIGTERM the service takes no new job and waits up to 300 s for the job that runs. The 30 s more are for it to log a job that it abandoned, and to exit.
    # 330 s covers that wait, not a job of up to 5,220,000 ms: stop or create the service again only when the runtime says free (RUNBOOK-sourcing-agent.md, "The restart rule").
    stop_grace_period: 330s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  sourcing-state: { name: sourcing-state }
