# The Insurer Intake Agent on the agents host: a runtime in front of a service. Two containers: intake-runtime and intake-service.
# The runtime serves the advert. It holds the supplier key, asks the service for the hook before it claims the escrow of a hirer, claims the escrow, and calls the service for the job. The service does the work and holds the service key of the agent.
# The env file sits next to this file (RUNBOOK-insurer-intake-agent.md, "The env file"). The service and the runtime both read it: .env.insurer-intake-agent.
# The operator makes it from .env.insurer-intake-agent.example, with mode 600. It holds two keys and a token, and it never enters git.
# A container reads its env file when it is created. After a change, create the container again: restart does not read it. Do it only when the runtime says free on /status (RUNBOOK-insurer-intake-agent.md, "The restart rule").
# The host builds no image. CI pushes the images. Each image below is named by its digest, not by a tag: a tag moves, and a later pull could change the bytes that run here.
# Replace each placeholder <digest> with the digest of the image of the reviewed commit (RUNBOOK-insurer-intake-agent.md, "The images"). Compose refuses to start a container while a placeholder is left (invalid reference format).
# The file has no networks key, on purpose. Compose puts the two containers on the default network of this project, insurer-intake-agent_default. The Caddy container of the host joins that network, and no other container does (Caddyfile.insurer-intake-agent.snippet).
# The service listens on 0.0.0.0 inside its container. A container on a network that others share could call it, so do not add a networks key here, and do not join another container to that network.
# SERVICE_URL names the container of the service, not the alias "service". The Caddy container joins the networks of several projects, and each project can have a service with that alias.
# The limits keep a fault in one container. A runtime of the other agents of the host uses about 190 MiB. If a container grows past its limit, the kernel stops that container only.
name: insurer-intake-agent
services:
  runtime:
    image: ghcr.io/apex-fusion/vector-service-agents/agent-runtime@sha256:<digest>
    container_name: intake-runtime
    restart: unless-stopped
    env_file: [ { path: ./.env.insurer-intake-agent, required: true } ]
    # The runtime holds the supplier key, from the env file. The service key is in the same file, so it is blanked here: an empty string overrides the value from an env file, and the runtime never holds it.
    # SERVICE_TIMEOUT_MS is 60 s more than the deadline of a job (300,000 ms), and 120 s inside the window of the advert (480,000 ms). The runtime refuses to boot unless it is at least 60 s inside the window.
    # SERVICE_PRECHECK_URL is the hook before the Claim. The runtime waits 10 s for the answer. The service answers it from its job slot, so it refuses a job while it works on another. A refusal leaves the escrow open.
    # PUBLIC_ORIGIN is the https origin of the host name of the runtime. The card of the runtime and the record of the agent name it, and it is the host of the block in Caddyfile.insurer-intake-agent.snippet.
    # RELEASE_WATCHER releases an escrow that the buyer did not accept, after the window of 600 s. It needs LIVE_CHAIN=1, which the env file sets.
    environment:
      CAPABILITY_KIND: custom
      SERVICE_URL: http://intake-service:9104/
      SERVICE_PRECHECK_URL: http://intake-service:9104/precheck
      SERVICE_CONTENT_TYPE: application/json
      SERVICE_TIMEOUT_MS: "360000"
      ADVERT_MAX_PROCESSING_MS: "480000"
      PORT: "8080"
      PUBLIC_ORIGIN: https://mp-suppliers-intake.vector.apexfusion.org
      RELEASE_WATCHER: "1"
      INTAKE_SERVICE_PRIV_KEY_HEX: ""
    ports: ["127.0.0.1:8106:8080"]
    depends_on: [service]
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  service:
    image: ghcr.io/apex-fusion/vector-service-agents/insurer-intake-agent@sha256:<digest>
    container_name: intake-service
    restart: unless-stopped
    # The service reads the same file as the runtime. It never holds the supplier key, which is the key of the runtime. SUPPLIER_PRIV_KEY_HEX is blanked below, so that no supplier key gets in by this file.
    env_file: [ { path: ./.env.insurer-intake-agent, required: true } ]
    # The service listens on 0.0.0.0:9104 inside its container, and the mapping below publishes it on 127.0.0.1 only. The compose values win over the env file.
    # INTAKE_STATE_DIR is the volume below.
    environment: { PORT: "9104", HOST: "0.0.0.0", SUPPLIER_PRIV_KEY_HEX: "", INTAKE_STATE_DIR: /data }
    ports: ["127.0.0.1:9104:9104"]
    # The records that must outlive the container: the escrows of the service key, the journal of the dispute code and the intake book (requests.json). docker compose down keeps the volume.
    volumes: ["intake-state:/data"]
    mem_limit: 1024m
    # On SIGTERM the service takes no new job and waits up to 300 s for the job that runs. The 30 s more are for it to log a job that it abandoned, and to exit.
    # 330 s covers that wait, not a job of up to 300,000 ms: stop or recreate the service only when the runtime says free (RUNBOOK-insurer-intake-agent.md, "The restart rule").
    stop_grace_period: 330s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  intake-state: { name: intake-state }
