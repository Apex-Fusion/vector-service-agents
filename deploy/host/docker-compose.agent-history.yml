# Agent History on the deployment host: template runtime (pinned) + this repo's service. Pattern: an earlier supplier stack of the operator.
# DEPLOYED since 2026-10-15: installed and running on the box since 2026-10-14; one first-party job settled on 2026-10-15. The order of work is RUNBOOK.md. The host administrator's part is README.md.
# The env file sits next to this file, is made from .env.agent-history.example, holds the supplier key and never enters git.
# After any change to it, recreate the containers: docker compose -f docker-compose.agent-history.yml up -d --force-recreate <service>. restart does not re-read it.
# Both containers join proxy, the external network of the host's reverse proxy, which other stacks share, and every agent here has a service named "service". The alias
# "service" would resolve to all of them, so SERVICE_URL names the container, which is unique. The path is /, the only path the service accepts POST on.
# The name of that network is not in the repository: compose reads PROXY_NETWORK from .env next to this file (RUNBOOK.md step 1), and stops while it has no value.
name: agent-history
services:
  agent:
    # The pin is the full commit a05564c. BuildKit does not resolve the abbreviated form (repository does not contain ref).
    build:
      context: https://github.com/Apex-Fusion/vector-agent-template.git#a05564cae3ca0e72a3591c8b2eb16c7909a60839
      dockerfile: agent/Dockerfile
    container_name: agent-history-agent
    restart: unless-stopped
    env_file: [ { path: ./.env.agent-history, required: true } ]
    environment:
      CAPABILITY_KIND: custom
      SERVICE_URL: http://agent-history-service:9091/
      SERVICE_CONTENT_TYPE: application/json
      SERVICE_TIMEOUT_MS: "180000"
      ADVERT_MAX_PROCESSING_MS: "300000"
      PORT: "8080"
      # The runtime serves the agent card and a 200 on GET / when PUBLIC_ORIGIN is set. The value is the https origin of the host that the agent record, the advert and the Caddy block name.
      # The runtime does not start when the value is not an https origin. SERVICE_PRECHECK_URL and RELEASE_WATCHER stay unset on purpose: the runtime asks the service nothing before the Claim, and it runs no release watcher.
      PUBLIC_ORIGIN: https://mp-suppliers-history.hal8.ai
    ports: ["127.0.0.1:8083:8080"]
    depends_on: [service]
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  service:
    # Pinned by digest, not by tag. The manifest this service renders is hashed into the advert, and :latest moves with every merge to main, so a later
    # pull could change the bytes behind that hash. The placeholder below is replaced on the box with the digest of the image that is there (RUNBOOK.md
    # step 2); compose refuses to start the service until it is (invalid reference format).
    image: ghcr.io/apex-fusion/vector-service-agents/agent-history@sha256:<digest>
    container_name: agent-history-service
    restart: unless-stopped
    env_file: [ { path: ./.env.agent-history, required: true } ]
    # The service holds no key. It reads the same file as the runtime, so the one secret in that file is blanked here.
    environment: { PORT: "9091", HOST: "0.0.0.0", SUPPLIER_PRIV_KEY_HEX: "" }
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
networks:
  proxy: { external: true, name: "${PROXY_NETWORK:?set PROXY_NETWORK in .env next to this compose file: the external network of the host's reverse proxy}" }
