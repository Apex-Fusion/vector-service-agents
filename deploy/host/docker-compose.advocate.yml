# Advocate on the deployment host: template runtime (pinned) + this repo's service. Pattern: Audio Snippets, with two keys, two API keys and a state volume.
# DEPLOYED since 2026-10-20: installed on the host since 2026-10-18 and running since 2026-10-19, on the image rebuilt from bd8e42d that day; one first-party job settled on 2026-10-20. The order of work is RUNBOOK-advocate.md: steps 1 to 15 and 17 ran from 2026-10-18 to 2026-10-20, as its first paragraph says. The host administrator's part is README.md.
# The env file sits next to this file, is made from .env.advocate.example, holds two keys (the supplier key for the runtime, the buyer key for the service), the token between the two containers and the two API keys of the service, and never enters git.
# After any change to it, recreate the containers. Once the runtime runs (step 13 of RUNBOOK-advocate.md), recreate only when its /status says free (curl -s http://127.0.0.1:8086/status): a stop during a job can cut a job under escrow. Before step 13 no job can run.
# docker compose -f docker-compose.advocate.yml up -d --force-recreate <service>. restart does not re-read it. A change to SERVICE_AUTH_HEADER needs both containers recreated.
# Both containers join proxy, the external network of the host's reverse proxy, which other stacks share, and every agent here has a service named "service". The alias
# "service" would resolve to all of them, so SERVICE_URL names the container, which is unique. The path is /, the only path the service accepts POST on.
# The name of that network is not in the repository: compose reads PROXY_NETWORK from .env next to this file (RUNBOOK-advocate.md step 1), and stops while it has no value.
# Both containers read the same file and each gets only its own key: the other one is blanked in its environment below (an empty string overrides the value from env_file).
# The service holds the two API keys, BRAVE_SEARCH_API_KEY and OPENROUTER_API_KEY, and reads them from the env file. The runtime needs neither, so both are blanked in its environment below.
# SERVICE_AUTH_HEADER is the one value both need, so neither blanks it: the runtime sends it as the authorization header of every call to the service (SERVICE_URL below), and the service requires it on POST /.
name: advocate
services:
  agent:
    # The pin is the full commit c4c378a. BuildKit does not resolve the abbreviated form (repository does not contain ref).
    build:
      context: https://github.com/Apex-Fusion/vector-agent-template.git#c4c378abdf2eb507ad454cbeb62b4f48bd5b46a6
      dockerfile: agent/Dockerfile
    container_name: advocate-agent
    restart: unless-stopped
    env_file: [ { path: ./.env.advocate, required: true } ]
    # The runtime holds the supplier key and signs the receipt. The buyer key and the two API keys are the service's: an empty string here overrides the values
    # from env_file, so the runtime never holds them.
    # SERVICE_TIMEOUT_MS sits 120 s inside the 8 min window of the advert (the runtime refuses to boot unless it is at least 60 s inside), and the service
    # answers a job within 300000 ms of its arrival, so a job ends with a result or a refusal before the runtime gives up on it; a hire in its Accept at that
    # time runs on, as the manifest says.
    environment:
      CAPABILITY_KIND: custom
      SERVICE_URL: http://advocate-service:9094/
      SERVICE_CONTENT_TYPE: application/json
      SERVICE_TIMEOUT_MS: "360000"
      ADVERT_MAX_PROCESSING_MS: "480000"
      PORT: "8080"
      ADVOCATE_BUYER_PRIV_KEY_HEX: ""
      BRAVE_SEARCH_API_KEY: ""
      OPENROUTER_API_KEY: ""
    ports: ["127.0.0.1:8086:8080"]
    depends_on: [service]
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  service:
    # Pinned by digest: the manifest this service renders is hashed into the advert, and :latest moves with every merge to main, so a later
    # pull or build could change the bytes behind that hash. The placeholder below is replaced on the host with the digest of the image that is there
    # (RUNBOOK-advocate.md step 2); compose refuses to start the service until it is (invalid reference format).
    image: ghcr.io/apex-fusion/vector-service-agents/advocate@sha256:<digest>
    container_name: advocate-service
    restart: unless-stopped
    env_file: [ { path: ./.env.advocate, required: true } ]
    # This service holds the buyer key, which posts the escrow of the chat sub-job of a job, and not the supplier key, which is the runtime's: that one is blanked here.
    # The service answers POST / only to a call that carries SERVICE_AUTH_HEADER, which the runtime sends, and no port is published: the network is shared with other stacks, and a job posts an escrow from the buyer wallet.
    environment: { PORT: "9094", HOST: "0.0.0.0", SUPPLIER_PRIV_KEY_HEX: "", ADVOCATE_STATE_DIR: /data }
    # stranded.json, the escrows a job left behind for the janitor, lives here and outlives the container. docker compose down keeps the volume.
    volumes: ["advocate-state:/data"]
    # One job at a time holds at most 12 pages of at most 1 MB each and their text in memory, and no model runs here.
    mem_limit: 1024m
    # On SIGTERM the service takes no new job and waits up to 300 s for the one that is running, its Accept included; the 30 s more than that are for it to
    # log a job it abandoned, with its escrow, and to exit 1. A grace period of 300 s or less kills a job under escrow mid-run, or the service before it can say what it left.
    stop_grace_period: 330s
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
networks:
  proxy: { external: true, name: "${PROXY_NETWORK:?set PROXY_NETWORK in .env next to this compose file: the external network of the host's reverse proxy}" }
volumes:
  advocate-state: { name: advocate-state }
