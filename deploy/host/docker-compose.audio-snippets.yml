# Audio Snippets on the deployment host: template runtime (pinned) + this repo's service. Pattern: Document Pipeline, with one key.
# PROPOSED (built, not deployed) since 2026-10-13. Not installed: no step of RUNBOOK-audio-snippets.md has been run. The host administrator's part is README.md.
# The env file sits next to this file, is made from .env.audio-snippets.example, holds the supplier key (the runtime's) and the token between the two containers, and never enters git.
# After any change to it, recreate the containers. Once the runtime runs (step 13 of RUNBOOK-audio-snippets.md), recreate only when its /status says free (curl -s http://127.0.0.1:8085/status): a stop during a job can cut a job under escrow. Before step 13 no job can run.
# docker compose -f docker-compose.audio-snippets.yml up -d --force-recreate <service>. restart does not re-read it. A change to SERVICE_AUTH_HEADER needs both containers recreated.
# Both containers join proxy, the external network of the host's reverse proxy, which other stacks share, and every agent here has a service named "service". The alias
# "service" would resolve to all of them, so SERVICE_URL names the container, which is unique. The path is /, the only path the service accepts POST on.
# The name of that network is not in the repository: compose reads PROXY_NETWORK from .env next to this file (RUNBOOK-audio-snippets.md step 1), and stops while it has no value.
# The runtime reads the supplier key from the env file. The service holds no key: the supplier key is blanked in its environment below (an empty string overrides the value from env_file).
# SERVICE_AUTH_HEADER is the one value both need, so neither blanks it: the runtime sends it as the authorization header of every call to the service (SERVICE_URL below), and the service requires it on POST /.
name: audio-snippets
services:
  agent:
    # The pin is the full commit c4c378a. BuildKit does not resolve the abbreviated form (repository does not contain ref).
    build:
      context: https://github.com/Apex-Fusion/vector-agent-template.git#c4c378abdf2eb507ad454cbeb62b4f48bd5b46a6
      dockerfile: agent/Dockerfile
    container_name: audio-snippets-agent
    restart: unless-stopped
    env_file: [ { path: ./.env.audio-snippets, required: true } ]
    # SERVICE_TIMEOUT_MS sits 120 s inside the 25 min window of the advert (the runtime refuses to boot unless it is at least 60 s inside), and the
    # service answers a job within 1320000 ms of its arrival, so a job ends with a result or a refusal before the runtime gives up on it.
    environment:
      CAPABILITY_KIND: custom
      SERVICE_URL: http://audio-snippets-service:9093/
      SERVICE_CONTENT_TYPE: application/json
      SERVICE_TIMEOUT_MS: "1380000"
      ADVERT_MAX_PROCESSING_MS: "1500000"
      PORT: "8080"
    ports: ["127.0.0.1:8085:8080"]
    depends_on: [service]
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  service:
    # Pinned by digest: the manifest this service renders is hashed into the advert, and :latest moves with every merge to main, so a later
    # pull or build could change the bytes behind that hash. The placeholder below is replaced on the host with the digest of the image that is there
    # (RUNBOOK-audio-snippets.md step 2); compose refuses to start the service until it is (invalid reference format).
    image: ghcr.io/apex-fusion/vector-service-agents/audio-snippets@sha256:<digest>
    container_name: audio-snippets-service
    restart: unless-stopped
    env_file: [ { path: ./.env.audio-snippets, required: true } ]
    # The service holds no key, and the supplier key, which is the runtime's, is blanked here. It answers POST / only to a call that carries SERVICE_AUTH_HEADER,
    # which the runtime sends, and no port is published: the network is shared with other stacks.
    environment: { PORT: "9093", HOST: "0.0.0.0", SUPPLIER_PRIV_KEY_HEX: "" }
    # One job at a time runs the speech model in this container: 3072m holds the model, the decode of 10 min of audio and ffmpeg. A job keeps nothing, so there is no volume.
    mem_limit: 3072m
    # On SIGTERM the service takes no new job and waits up to 300 s for the one that is running; the 30 s more than that are for it to log a job it
    # abandoned and to exit 1. A grace period of 300 s or less kills a job under escrow mid-run, or the service before it can say what it left.
    stop_grace_period: 330s
    networks: [proxy]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
networks:
  proxy: { external: true, name: "${PROXY_NETWORK:?set PROXY_NETWORK in .env next to this compose file: the external network of the host's reverse proxy}" }
