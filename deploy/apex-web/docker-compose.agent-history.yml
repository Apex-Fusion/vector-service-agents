# Agent History on apex-web: template runtime (pinned) + this repo's service. Pattern: chandra-supplier.
# PROPOSED: running on the box since 2026-10-14, no job settled. The order of work is RUNBOOK.md. The host administrator's part is README.md.
# The env file sits next to this file, is made from .env.agent-history.example, holds the supplier key and never enters git.
# After any change to it, recreate the containers: docker compose -f docker-compose.agent-history.yml up -d --force-recreate <service>. restart does not re-read it.
# Both containers join umami_default, which other stacks share, and every agent here has a service named "service". The alias
# "service" would resolve to all of them, so SERVICE_URL names the container, which is unique. The path is /, the only path the service accepts POST on.
name: agent-history
services:
  agent:
    # The pin is the full commit c4c378a. BuildKit does not resolve the abbreviated form (repository does not contain ref).
    build:
      context: https://github.com/Apex-Fusion/vector-agent-template.git#c4c378abdf2eb507ad454cbeb62b4f48bd5b46a6
      dockerfile: agent/Dockerfile
    container_name: agent-history-agent
    restart: unless-stopped
    env_file: [ { path: ./.env.agent-history, required: true } ]
    environment:
      CAPABILITY_KIND: custom
      SERVICE_URL: http://agent-history-service:9091/
      SERVICE_CONTENT_TYPE: application/json
      SERVICE_TIMEOUT_MS: "180000"
      ADVERT_MAX_PROCESSING_MS: "300000"
      PORT: "8080"
    ports: ["127.0.0.1:8083:8080"]
    depends_on: [service]
    networks: [umami_default]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  service:
    # Pinned by digest, not by tag. The manifest this service renders is hashed into the advert, and :latest moves with every merge to main, so a later
    # pull could change the bytes behind that hash. The placeholder below is replaced on the box with the digest of the image that is there (RUNBOOK.md
    # step 2); compose refuses to start the service until it is (invalid reference format).
    image: ghcr.io/apex-fusion/vector-service-agents/agent-history@sha256:<digest>
    container_name: agent-history-service
    restart: unless-stopped
    env_file: [ { path: ./.env.agent-history, required: true } ]
    # The service holds no key. It reads the same file as the runtime, so the one secret in that file is blanked here.
    environment: { PORT: "9091", HOST: "0.0.0.0", SUPPLIER_PRIV_KEY_HEX: "" }
    networks: [umami_default]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
networks:
  umami_default: { external: true, name: umami_default }
