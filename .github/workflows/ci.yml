name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # poppler-utils gives pdfinfo and pdftoppm, which the Document Pipeline renders PDFs with. REQUIRE_POPPLER makes a failed install fail the tests
      # that need them instead of skipping them.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REQUIRE_POPPLER: "1"
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/agent-history/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/agent-history:latest
            ghcr.io/apex-fusion/vector-service-agents/agent-history:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/document-pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/document-pipeline:latest
            ghcr.io/apex-fusion/vector-service-agents/document-pipeline:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
