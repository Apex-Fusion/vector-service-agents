name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  AGENT_RUNTIME_IMAGE: ghcr.io/apex-fusion/vector-service-agents/agent-runtime
  AGENT_RUNTIME_TEMPLATE_COMMIT: 'a05564cae3ca0e72a3591c8b2eb16c7909a60839'
  # Pin the full index, not the platform manifest. The index keeps the provenance.
  AGENT_RUNTIME_DIGEST: sha256:02329b1a881cb989a93f0ab5bcc92df48fcf8cc5803b8f52d7a13947e8ed6134
jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # deploy.test.mjs renders the compose files with docker compose config. The runner image has no docker compose, and without it those tests skip.
      - uses: docker/setup-compose-action@v2
      - name: Check the pinned runtime image
        shell: bash
        run: |
          image=$(docker buildx imagetools inspect --format \
            '{{.Image.OS}}/{{.Image.Architecture}} {{index .Image.Config.Labels "vector-agent-template.commit"}} {{index .Image.Config.Labels "org.opencontainers.image.source"}}' \
            "$AGENT_RUNTIME_IMAGE@$AGENT_RUNTIME_DIGEST")
          printf '%s\n' "$image"
          test "$image" = "linux/amd64 $AGENT_RUNTIME_TEMPLATE_COMMIT https://github.com/Apex-Fusion/vector-service-agents"
      # poppler-utils gives pdfinfo and pdftoppm, which the Document Pipeline renders PDFs with, and ffmpeg gives ffmpeg and ffprobe, which Audio Snippets
      # reads and cuts media with. REQUIRE_POPPLER and REQUIRE_ASR make a failed install fail the tests that need them instead of skipping them.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
      # The speech model of Audio Snippets: Python 3.11 with the pinned requirements, and the files of the model at the revision asr/fetch_model.py pins. The
      # cache, under that revision, saves the download; the fetch runs every time all the same, because it checks the size and the sha256 of each of the four
      # files and fetches only when one is not as pinned, so a cache that holds something else is caught before the tests.
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --disable-pip-version-check -r agents/audio-snippets/asr/requirements.txt
      - uses: actions/cache@v4
        with:
          path: agents/audio-snippets/.models/base
          key: whisper-base-ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
      - run: python -I agents/audio-snippets/asr/fetch_model.py base agents/audio-snippets/.models/base
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REQUIRE_POPPLER: "1"
          REQUIRE_ASR: "1"
  # Check the images of this repository on pull requests. Do not push them.
  build:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/agent-history/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/document-pipeline/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/audio-snippets/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/advocate/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/reorder-agent/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/order-desk/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/prior-authorization-agent/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/insurer-intake-agent/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/bid-desk/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/sourcing-agent/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mock-systems/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/operator/Dockerfile
          push: false
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/agent-history/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/agent-history:latest
            ghcr.io/apex-fusion/vector-service-agents/agent-history:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/document-pipeline/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/document-pipeline:latest
            ghcr.io/apex-fusion/vector-service-agents/document-pipeline:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/audio-snippets/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/audio-snippets:latest
            ghcr.io/apex-fusion/vector-service-agents/audio-snippets:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/advocate/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/advocate:latest
            ghcr.io/apex-fusion/vector-service-agents/advocate:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/reorder-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/reorder-agent:latest
            ghcr.io/apex-fusion/vector-service-agents/reorder-agent:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/order-desk/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/order-desk:latest
            ghcr.io/apex-fusion/vector-service-agents/order-desk:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/prior-authorization-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/prior-authorization-agent:latest
            ghcr.io/apex-fusion/vector-service-agents/prior-authorization-agent:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/insurer-intake-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/insurer-intake-agent:latest
            ghcr.io/apex-fusion/vector-service-agents/insurer-intake-agent:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/bid-desk/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/bid-desk:latest
            ghcr.io/apex-fusion/vector-service-agents/bid-desk:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/sourcing-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/sourcing-agent:latest
            ghcr.io/apex-fusion/vector-service-agents/sourcing-agent:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mock-systems/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/mock-systems:latest
            ghcr.io/apex-fusion/vector-service-agents/mock-systems:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/operator/Dockerfile
          push: true
          tags: |
            ghcr.io/apex-fusion/vector-service-agents/operator:latest
            ghcr.io/apex-fusion/vector-service-agents/operator:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Tag the pinned runtime image
        shell: bash
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$AGENT_RUNTIME_IMAGE:$GITHUB_SHA" \
            --tag "$AGENT_RUNTIME_IMAGE:latest" \
            "$AGENT_RUNTIME_IMAGE@$AGENT_RUNTIME_DIGEST"
          for tag in "$GITHUB_SHA" latest; do
            actual=$(docker buildx imagetools inspect --raw "$AGENT_RUNTIME_IMAGE:$tag" | sha256sum)
            if [ "sha256:${actual%% *}" != "$AGENT_RUNTIME_DIGEST" ]; then
              printf 'Unexpected digest for %s:%s: sha256:%s\n' "$AGENT_RUNTIME_IMAGE" "$tag" "${actual%% *}" >&2
              exit 1
            fi
          done
